services:
  jellyfin-legacy-candidate:
    image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    init: true
    user: "${PUID:?Set PUID}:${PGID:?Set PGID}"
    environment:
      TZ: ${TZ:?Set TZ}
    volumes:
      - ${LEGACY_CANDIDATE_ROOT:?Set LEGACY_CANDIDATE_ROOT}/config:/config
      - ${LEGACY_CANDIDATE_ROOT:?Set LEGACY_CANDIDATE_ROOT}/cache:/cache
      - ${LEGACY_CANDIDATE_ROOT:?Set LEGACY_CANDIDATE_ROOT}/KefinTweaks:/jellyfin/jellyfin-web/KefinTweaks:ro
      - ${MEDIA_ROOT:?Set MEDIA_ROOT}/library:/data/library:ro
    ports:
      - "127.0.0.1:${LEGACY_CANDIDATE_PORT:-18096}:8096/tcp"
    networks:
      - legacy-ui-candidate
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    labels:
      io.veinfin.managed: "candidate-only"
      io.veinfin.exposure: "loopback"

networks:
  legacy-ui-candidate:
    internal: false
    labels:
      io.veinfin.network-purpose: "isolated-legacy-ui-candidate"
